name: Android APK
on:
  workflow_dispatch:
    inputs:
      game_id:
        description: "Keisho set name (hotd, manxtt, daytona, srallyc, ...)"
        default: "hotd"
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build glslc cmake
      - name: Unpack patch
        run: |
          # model2_patch.zip is uploaded to .github/workflows/ (same flow as hotd2)
          unzip -o .github/workflows/model2_patch.zip -d . || true
          python3 apply_patch.py
      - name: Build native (arm64, GLES 3.1)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSM2_BUILD_OPENGL_DESKTOP=OFF -DSM2_BUILD_OPENGL_ES=ON \
            -DSM2_EVDEV=OFF -DSM2_BUILD_TESTS=OFF -DSM2_BUILD_VULKAN=OFF
          cmake --build build-android -j$(nproc)
      - name: Stage app
        run: |
          J=android/app/src/main/jniLibs/arm64-v8a; mkdir -p $J
          cp $(find build-android -name libmain.so | head -1) $J/
          cp $(find build-android -name libSDL3.so | head -1) $J/
          A=android/app/src/main/assets
          cp data/games.xml $A/ && cp -r data/lang $A/lang
          echo -n "${{ github.event.inputs.game_id || 'hotd' }}" > $A/game.txt
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp 3rdparty/SDL/android-project/app/src/main/java/org/libsdl/app/*.java android/app/src/main/java/org/libsdl/app/
      - name: Gradle
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: keisho-model2-apk
          path: android/app/build/outputs/apk/debug/*.apk
